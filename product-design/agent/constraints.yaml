# Agent-facing constraints -- machine-parseable version of product-design/constitution.md
# Generated by /design on 2026-10-05. Executable checks live in spec-checks.yaml.

version: 1

constraints:
  technical:
    - id: tech-001
      rule: "PASS is a tool result, not a sentence: a BUILD step counts as done only with a gate PASS, or with an explicit 'gate not installed' note"
      scope: "all"
      verify: "step notes in plan progress files carry --gate-json or --gate not-installed / not-run"
    - id: tech-002
      rule: "No as-intended, no cycle: /plan refuses to start without product-design/product-design-as-intended.md"
      scope: "all"
      verify: "file_exists: product-design/product-design-as-intended.md (spec-checks proj-001)"
    - id: tech-003
      rule: "Artifacts under _output/ are immutable; corrections are appended (revoked / superseded with reason)"
      scope: "all"
      verify: "git diff of existing _output/ artifacts shows appends only"
    - id: tech-004
      rule: "Human (markers) files receive only markers from agents, via apply_marker.py, after same-turn confirmation"
      scope: "all"
      verify: "check_human_markers_only.py (post-skill step 6c)"
    - id: tech-005
      rule: "Skill orchestrates, agent executes in isolated context; users never invoke agents directly"
      scope: "all"
      verify: "review: no user-facing instruction tells the user to call an agent"
    - id: tech-006
      rule: "Stack-agnostic boundary: the harness consumes gate/runner contracts, never the tool; a stack with no adapter degrades to 'not measured'"
      scope: "all"
      verify: "check_quality_gate.py SKIPs where the gate is not installed"

  quality:
    - id: qual-001
      rule: "Harness changes land only with pytest .claude/skills/scripts/tests/ green and no new run_all_checks.py failure"
      scope: "all"
      verify: "pytest .claude/skills/scripts/tests/ && python .claude/skills/scripts/run_all_checks.py"
    - id: qual-002
      rule: "/critique always precedes /document and /communicate"
      scope: "all"
      verify: "briefs.md ordering per plan"
    - id: qual-003
      rule: "Every recorded hypothesis carries what would confirm and what would refute it; thresholds fixed before data"
      scope: "all"
      verify: "review of H-NNN entries in product-design-as-intended.md §3"
    - id: qual-004
      rule: "What was not measured is reported as 'not measured', next to what was"
      scope: "all"
      verify: "review of /reflect and /explain drift output"

  security:
    - id: sec-001
      rule: "The gate runs with no network and no API key in the child environment"
      scope: "all"
      verify: "review of gate.py subprocess environment"
    - id: sec-002
      rule: "The agent never moves the ratchet nor skips the gate (--accept-baseline, --no-verify denied; Stop and PreToolUse hooks active)"
      scope: "all"
      verify: "file_exists: .claude/hooks/quality_gate_*.py (spec-checks proj-003, proj-004)"
    - id: sec-003
      rule: "No secrets in source, _output/ or product-design/"
      scope: "all"
      verify: "check_secrets.py"
