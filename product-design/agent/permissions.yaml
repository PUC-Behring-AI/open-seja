# Agent-facing permission matrix -- structured version of product-design-as-intended.md §4
# Generated by /design on 2026-10-05. Resources are file classes, not entities.

version: 1

roles:
  - name: "designer"
    description: "Human owner: writes prose in Human and Human (markers) files, approves markers, moves the gate ratchet"
    inherits: null
  - name: "agent"
    description: "Skills and subagents: write _output/ and Agent files; apply markers after confirmation"
    inherits: null
  - name: "reader"
    description: "Clones main (publish manifest), runs /seja-setup --here"
    inherits: null

permissions:
  - resource: "human-markers-file"
    actions:
      - action: "write-prose"
        allowed_roles: ["designer"]
        conditions: null
      - action: "write-marker"
        allowed_roles: ["designer", "agent"]
        conditions: "agent only via apply_marker.py after same-turn confirmation"
  - resource: "output-artifact"
    actions:
      - action: "create"
        allowed_roles: ["designer", "agent"]
        conditions: "id reserved by reserve_id.py"
      - action: "update"
        allowed_roles: ["designer", "agent"]
        conditions: "append-only (revoked / superseded with reason)"
  - resource: "gate-baseline"
    actions:
      - action: "update"
        allowed_roles: ["designer"]
        conditions: "quality-baseline.json and GATE_* rows; denied to agent by hooks"
  - resource: "main-branch"
    actions:
      - action: "read"
        allowed_roles: ["designer", "agent", "reader"]
        conditions: "publish manifest only"
